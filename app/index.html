<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Application | Production</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            border-radius: 20px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.3);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 18px;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #86efac;
            padding: 10px 20px;
            border-radius: 50px;
            margin-bottom: 35px;
            font-weight: bold;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 14px;
        }

        .info-box .icon {
            font-size: 25px;
            margin-bottom: 10px;
        }

        .info-box h3 {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .info-box p {
            font-size: 16px;
            font-weight: bold;
        }

        .pipeline {
            margin-top: 35px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .pipeline h2 {
            font-size: 20px;
            margin-bottom: 20px;
        }

        .steps {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .step {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 13px;
        }

        .arrow {
            color: #38bdf8;
            font-weight: bold;
        }

        footer {
            margin-top: 30px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .card {
                padding: 30px 20px;
            }

            h1 {
                font-size: 30px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .steps {
                flex-direction: column;
            }

            .arrow {
                transform: rotate(90deg);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            🚀
        </div>

        <h1>Hello from Production</h1>

        <p class="subtitle">
            My Application is successfully running on AWS
        </p>

        <div class="status">
            <span class="status-dot"></span>
            Production Environment — Online
        </div>

        <div class="info-grid">

            <div class="info-box">
                <div class="icon">🐳</div>
                <h3>Container</h3>
                <p>Docker</p>
            </div>

            <div class="info-box">
                <div class="icon">☁️</div>
                <h3>Cloud</h3>
                <p>AWS EC2</p>
            </div>

            <div class="info-box">
                <div class="icon">📦</div>
                <h3>Registry</h3>
                <p>AWS ECR</p>
            </div>

        </div>

        <div class="pipeline">

            <h2>CI/CD Pipeline</h2>

            <div class="steps">

                <div class="step">GitHub</div>

                <div class="arrow">→</div>

                <div class="step">Jenkins</div>

                <div class="arrow">→</div>

                <div class="step">Docker Build</div>

                <div class="arrow">→</div>

                <div class="step">AWS ECR</div>

                <div class="arrow">→</div>

                <div class="step">AWS EC2</div>

            </div>

        </div>

        <footer>
            Jenkins + Docker + AWS ECR + EC2
            <br>
            Deployment Pipeline Demo
        </footer>

    </div>

</div>

</body>
</html>
